name: 每日情报采编
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-editorial
  cancel-in-progress: false

jobs:
  generate:
    if: vars.ENABLE_DAILY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
      GH_DAILY_PROVIDER: cloud
      GH_DAILY_BASE_URL: ${{ vars.LLM_BASE_URL }}
      GH_DAILY_MODEL: ${{ vars.LLM_MODEL }}
      GH_DAILY_API_KEY: ${{ secrets.LLM_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: python -m pip install -e .
      - name: 执行采编（保留独立成功的子任务）
        id: editorial
        continue-on-error: true
        run: python -m gh_daily --root . update
      - name: 验证公开产物和待提交路径
        run: |
          python -m gh_daily build
          python -m gh_daily check-changes
      - name: 保存公开报告到本仓库
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- GitHub项目分析 AI前沿资讯/日报 dist tools/_杂志数据.json content-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m '更新每日公开情报'
            printf '%s\n' "https://x-access-token:${GH_TOKEN}@github.com" > "$RUNNER_TEMP/daily-git-credentials"
            chmod 600 "$RUNNER_TEMP/daily-git-credentials"
            git -c credential.helper="store --file=$RUNNER_TEMP/daily-git-credentials" push "https://github.com/${REPOSITORY}.git" "HEAD:${BRANCH}"
            rm -f "$RUNNER_TEMP/daily-git-credentials"
          fi
      - name: 标记未完成的采编
        if: steps.editorial.outcome == 'failure'
        run: |
          echo '部分采编未完成；已保留有效产物，请查看脱敏执行摘要后重试。'
          exit 1
