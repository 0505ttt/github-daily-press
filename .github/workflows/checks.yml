name: 公开版检查
on:
  push:
    paths-ignore: ['dist/**', 'GitHub项目分析/**', 'AI前沿资讯/**', 'content-manifest.json', 'tools/_杂志数据.json']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_sw.js
      - run: node tests/test_pwa.js
      - run: node tests/test_settings.js
      - run: python -m gh_daily build
      - run: python -m gh_daily privacy
