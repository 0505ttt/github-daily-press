name: 发布在线阅读
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['每日情报采编']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/configure-pages@v5
        id: pages
      - run: python -m pip install -e .
      - name: 构建独立在线阅读版
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python -m gh_daily build --hosted --base-path "${BASE_PATH%/}/"
      - name: 上传经过隐私检查的 dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
